  const pad={l:8,r:64,t:14,b:20};
  const n=kl.length;
  const lo=Math.min(...kl.map(k=>k[4]))*0.98, hi=Math.max(...kl.map(k=>k[3]))*1.02;
  const dmap={};kl.forEach((k,i)=>dmap[k[0]]=i);
  const X=i=>pad.l+(W-pad.l-pad.r)*i/(n-1);
  const Y=p=>pad.t+(H-pad.t-pad.b)*(1-(p-lo)/(hi-lo));
  // K线
  kl.forEach((k,i)=>{
    const up=k[2]>=k[1];
    ctx.strokeStyle=up?"#3fb950":"#f85149";ctx.fillStyle=up?"#0d1117":"#f85149";
    const x=X(i);
    ctx.beginPath();ctx.moveTo(x,Y(k[3]));ctx.lineTo(x,Y(k[4]));ctx.stroke();
    const bw=Math.max(1.5,(W-pad.l-pad.r)/n*0.6);
    const y1=Y(Math.max(k[1],k[2])),y2=Y(Math.min(k[1],k[2]));
    ctx.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));ctx.strokeRect(x-bw/2,y1,bw,Math.max(1,y2-y1));
  });
  // 中枢矩形
  zs.forEach(z=>{
    const i1=dmap[z.s],i2=dmap[z.e];
    if(i1===undefined||i2===undefined)return;
    ctx.fillStyle=z.sure?"rgba(137,87,229,0.10)":"rgba(137,87,229,0.05)";
    ctx.strokeStyle=z.sure?"#8957e5":"#6e40c9";ctx.setLineDash(z.sure?[]:[4,3]);
    const x1=X(i1),x2=X(i2),y1=Y(z.high),y2=Y(z.low);
    ctx.fillRect(x1,y1,x2-x1,y2-y1);ctx.strokeRect(x1,y1,x2-x1,y2-y1);ctx.setLineDash([]);
    ctx.fillStyle="#8957e5";ctx.font="10px sans-serif";ctx.fillText("ZS",x1+3,y1-2);
  });
  // 笔
  ctx.lineWidth=1.6;
  bi.forEach(b=>{
    const i1=dmap[b.s],i2=dmap[b.e];
    if(i1===undefined||i2===undefined)return;
    ctx.strokeStyle=b.dir>0?"#3fb950":"#f85149";ctx.globalAlpha=b.sure?1:0.45;
    ctx.beginPath();ctx.moveTo(X(i1),Y(b.sp));ctx.lineTo(X(i2),Y(b.ep));ctx.stroke();
    ctx.globalAlpha=1;
  });
  // 买卖点
  ctx.font="11px sans-serif";
  bsp.forEach(s=>{
    const i=dmap[s.t];if(i===undefined)return;
    const p=kl[i][2];
    const y=s.buy?Y(kl[i][4])+14:Y(kl[i][3])-8;
    ctx.fillStyle=s.buy?"#3fb950":"#f85149";
    ctx.beginPath();ctx.arc(X(i),s.buy?Y(kl[i][4])+5:Y(kl[i][3])-5,3.2,0,7);ctx.fill();
    ctx.fillText(s.buy?"B":"S",X(i)-3,s.buy?y+4:y);
  });
  // 价格轴
  ctx.fillStyle="#8b949e";ctx.font="10px sans-serif";
  for(let k=0;k<5;k++){const p=lo+(hi-lo)*k/4;ctx.fillText(p.toFixed(0),W-pad.r+6,Y(p)+3);}
  // 信息
  const last=kl[n-1],buyN=bsp.filter(s=>s.buy).length,sellN=bsp.length-buyN;
  document.getElementById("info").innerHTML=
   names[cur]+" 收盘 <b style='color:#58a6ff'>"+last[2].toFixed(1)+"</b>（"+last[0]+"）｜窗口"+n+"根｜笔"+bi.length+"（绿升红降，淡=未确认）｜中枢"+zs.length+"（紫框）｜买点"+buyN+" 卖点"+sellN+"｜最近买卖点: "+bsp.slice(-4).map(s=>s.t+(s.buy?"买":"卖")).join(" / ");
}
window.onresize=draw;draw();
</script></body></html>
