<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Maja Assistant</title>
<style>
:root{--bg:#0f1420;--card:#1a2232;--fg:#e8ecf4;--dim:#8b94a7;--acc:#5b8cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
.t{align-self:flex-start;color:var(--dim);font-size:12px;max-width:86%}
#bar{display:flex;gap:8px;padding:10px;background:var(--card)}
#inp{flex:1;background:#0f1420;border:1px solid #2a3550;color:var(--fg);border-radius:10px;padding:12px;font-size:16px;outline:none}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:0 18px;font-size:16px}
#cfg{padding:10px;background:#131a28;display:flex;gap:8px}
#cfg input{flex:1;background:#0f1420;border:1px solid #2a3550;color:var(--fg);border-radius:8px;padding:8px;font-size:13px}
</style>
</head>
<body>
<div id="cfg">
  <input id="api" placeholder="服务器地址" value="">
  <input id="tok" placeholder="访问令牌" type="password">
  <button onclick="save()">存</button>
</div>
<div id="msgs"></div>
<div id="bar">
  <input id="inp" placeholder="输入消息…" onkeydown="if(event.key=='Enter')send()">
  <button onclick="send()">发</button>
</div>
<script>
const API=document.getElementById('api'),TOK=document.getElementById('tok'),MS=document.getElementById('msgs'),INP=document.getElementById('inp');
API.value=localStorage.getItem('api')||'https://postings-monetary-controlling-measures.trycloudflare.com';
TOK.value=localStorage.getItem('tok')||'';
function save(){localStorage.setItem('api',API.value.trim());localStorage.setItem('tok',TOK.value.trim());add('sys','已保存配置')}
function add(cls,txt){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;MS.appendChild(d);MS.scrollTop=MS.scrollHeight;return d}
let sid=localStorage.getItem('sid')||'';
async function send(){
  const text=INP.value.trim(); if(!text)return; INP.value='';
  add('u',text);
  const el=add('a','');
  try{
    const res=await fetch(API.value.replace(/\/$/,'')+'/api/chat'+(sid?'/'+sid:''),{
      method:'POST',
      headers:{'Authorization':'Bearer '+TOK.value,'Content-Type':'application/json'},
      body:JSON.stringify({text, session_id: sid||undefined})
    });
    const reader=res.body.getReader(),dec=new TextDecoder();
    let buf='',out='';
    while(true){
      const {done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n'); buf=parts.pop();
      for(const p of parts){
        const ev=(p.match(/event: (.*)/)||[])[1], d=(p.match(/data: ?([\s\S]*)/)||[])[1]||'';
        if(ev==='delta'){out+=d;el.textContent=out;MS.scrollTop=MS.scrollHeight}
        else if(ev==='done'){try{const j=JSON.parse(d);if(j.session_id)sid=j.session_id,localStorage.setItem('sid',sid)}catch(e){}}
      }
    }
  }catch(e){el.textContent='连接失败: '+e.message+'\n检查服务器地址与令牌'}
}
add('a','已连接 Maja Assistant。服务器状态: '+ (API.value?'已配置':'未配置'));
</script>
</body>
</html>
